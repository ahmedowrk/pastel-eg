name: pastel
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  cupertino_icons: ^1.0.8
  device_info_plus: ^11.3.0
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter:
    sdk: flutter
  app_badge_plus: ^1.1.5
  flutter_local_notifications: ^20.1.0
  permission_handler: ^12.0.3
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.12.0
  image_picker: ^1.2.2
  flutter_facebook_auth: ^6.1.0
  http: ^1.2.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/pastel.png"
  min_sdk_android: 23

flutter:
  uses-material-design: true
  assets:
    - assets/pastel.png
