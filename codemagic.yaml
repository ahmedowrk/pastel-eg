workflows:
  ios-unsigned-check:
    name: Pastel iOS Readiness & Unsigned IPA Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Verify YouTube iOS Client ID & Reversed URL Scheme in Info.plist
        script: |
          TRIMMED_ENV_ID="$(echo "${YOUTUBE_IOS_CLIENT_ID:-}" | xargs)"
          if [ -n "$TRIMMED_ENV_ID" ] && [[ "$TRIMMED_ENV_ID" == *.apps.googleusercontent.com ]]; then
            /usr/libexec/PlistBuddy -c "Set :YouTubeIOSClientID $TRIMMED_ENV_ID" ios/Runner/Info.plist
          fi
          CLIENT_ID=$(/usr/libexec/PlistBuddy -c "Print :YouTubeIOSClientID" ios/Runner/Info.plist 2>/dev/null || true)
          if [ -n "$CLIENT_ID" ] && [[ "$CLIENT_ID" == *.apps.googleusercontent.com ]]; then
            PREFIX="${CLIENT_ID%.apps.googleusercontent.com}"
            REVERSED="com.googleusercontent.apps.${PREFIX}"
            /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:1:CFBundleURLSchemes:0 $REVERSED" ios/Runner/Info.plist
            echo "Verified YouTubeIOSClientID: $CLIENT_ID"
            echo "Verified Reversed Client ID: $REVERSED"
          else
            echo "ERROR: Missing valid YouTubeIOSClientID in ios/Runner/Info.plist"
            exit 1
          fi
      - name: Get Flutter packages (Enforce Lockfile)
        script: flutter pub get --enforce-lockfile
      - name: Flutter Analyze
        script: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
      - name: Build iOS Release (No Codesign)
        script: flutter build ios --release --no-codesign
      - name: Package Unsigned IPA
        script: |
          mkdir -p build/ios/ipa_unsigned/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa_unsigned/Payload/
          cd build/ios/ipa_unsigned
          zip -r -9 Pastel-iOS-Unsigned.ipa Payload
    artifacts:
      - build/ios/ipa_unsigned/Pastel-iOS-Unsigned.ipa

  ios-release-signed:
    name: Pastel iOS Signed Release IPA (App Store / TestFlight Ready)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pasteleg.app
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Get Flutter packages (Enforce Lockfile)
        script: flutter pub get --enforce-lockfile
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
      - name: Flutter Build Signed IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
